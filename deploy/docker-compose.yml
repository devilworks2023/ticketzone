version: '3.8'

services:
  ticketzone:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ticketzone-web
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - ticketzone-data:/app/data
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ticketzone-network

networks:
  ticketzone-network:
    driver: bridge

volumes:
  ticketzone-data:
    driver: local
