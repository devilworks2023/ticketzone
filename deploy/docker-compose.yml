services:
  ticketzone:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ticketzone-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Madrid
      - DATABASE_PATH=/app/data/ticketzone.db
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # SMTP
      - SMTP_HOST=${SMTP_HOST:-smtp.ionos.es}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@tudominio.com}
      - APP_URL=${APP_URL:-https://tudominio.com}
    volumes:
      - ticketzone-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        mode: "non-blocking"
    tty: true
    stdin_open: true

volumes:
  ticketzone-data:
    driver: local

networks:
  default:
    name: ticketzone-network
