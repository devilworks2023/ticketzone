services:
  ticketzone:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ticketzone-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:80"
    environment:
      - NODE_ENV=production
      - TZ=Europe/Madrid
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ticketzone-network

