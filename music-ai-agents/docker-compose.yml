# MusicLab AI — dos servicios:
#   web          → frontend Expo Web + backend tRPC/Hono (Dockerfile raíz)
#   transcription→ servicio MT3 de transcripción multi-instrumento (transcription-service/)
#
# `docker compose up --build` levanta ambos. El backend descubre el servicio de
# transcripción por TRANSCRIPTION_SERVICE_URL. Si ese servicio está caído, el
# análisis degrada con gracia (transcribed: false) y la app sigue funcionando.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_PATH=/app/data/musiclab.db
      - TRANSCRIPTION_SERVICE_URL=http://transcription:8000
      - TRANSCRIPTION_TIMEOUT_MS=900000
    volumes:
      - musiclab-data:/app/data
    depends_on:
      - transcription

  transcription:
    build:
      context: ./transcription-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # MT3 (jax + tensorflow) es intensivo en CPU/RAM. Reserva memoria suficiente
    # (recomendado >= 3-4 GB RAM).
    environment:
      - MT3_MODEL_TYPE=mt3
      - JAX_PLATFORMS=cpu
    expose:
      - "8000"

volumes:
  musiclab-data:
    driver: local
